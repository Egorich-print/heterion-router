[package]
name = "omniroute-desktop"
version = "0.1.0"
description = "OmniRoute desktop shell (Tauri v2)"
authors = ["OmniRoute Team"]
license = "MIT"
repository = "https://github.com/Egorich-print/OmniRoute-Rust"
edition = "2024"
rust-version = "1.98"

[lib]
name = "omniroute_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3" }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.3" }
tauri-plugin-log = "2"
