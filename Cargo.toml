# OmniRoute Rust workspace.
#
# This is the foundation of the JS -> Rust rewrite (axum + Tauri v2 + Svelte).
# It lives next to the existing Next.js/Electron app so the port can proceed
# crate by crate without breaking the shipping build.
[workspace]
resolver = "3"
members = [
    "crates/omniroute-config",
    "crates/omniroute-core",
    "crates/omniroute-db",
    "crates/omniroute-gateway",
    "crates/omniroute-providers",
    "crates/omniroute-usage",
]
# The Tauri desktop app is a heavy, standalone binary app: keep it out of the
# fast gateway workspace/CI loop. Build it with `cargo tauri` in desktop/.
exclude = ["desktop/src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
license = "MIT"
authors = ["OmniRoute Team"]

[workspace.dependencies]
omniroute-config = { path = "crates/omniroute-config" }
omniroute-core = { path = "crates/omniroute-core" }
omniroute-db = { path = "crates/omniroute-db" }
omniroute-providers = { path = "crates/omniroute-providers" }
omniroute-usage = { path = "crates/omniroute-usage" }

axum = "0.8"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.40", features = ["bundled"] }
thiserror = "2"
tempfile = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
async-trait = "0.1"
futures = "0.3"
tokio-stream = "0.1"
insta = "1"
wiremock = "0.6"
reqwest = { version = "0.12", default-features = false, features = [
    "json",
    "rustls-tls",
] }

[profile.release]
lto = "thin"
codegen-units = 1
