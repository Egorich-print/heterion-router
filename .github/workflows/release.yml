# Release: gateway binaries and macOS .app bundle on tag v* or manual dispatch.
# Jenkins does not publish releases while this workflow exists (see Jenkinsfile).

name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref to build"
        default: main
      tag:
        description: "Release tag (for manual runs; empty = gateway-YYYYMMDD-<sha>)"
        default: ""

permissions:
  contents: write

jobs:
  gateway:
    name: gateway binary (${{ matrix.os }})
    strategy:
      matrix:
        os: [ubuntu-latest, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'push' && github.ref_name || inputs.ref }}
      - uses: dtolnay/rust-toolchain@1.99.1
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --release -p heterion-router-gateway
      - name: Assert the macOS build is arm64
        # The release assets are named for the architecture they contain. A
        # runner of the wrong architecture would ship an x86_64 binary under
        # an arm64 name, so the job fails instead of mislabelling it.
        if: runner.os == 'macOS'
        run: |
          set -eu
          TRIPLE="$(rustc -vV | sed -n 's/^host: //p')"
          echo "host triple: $TRIPLE"
          [ "$TRIPLE" = "aarch64-apple-darwin" ] || {
            echo "expected aarch64-apple-darwin, got $TRIPLE" >&2; exit 1; }
      - name: Package + publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_IN: ${{ inputs.tag }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -eu
          TRIPLE="$(rustc -vV | sed -n 's/^host: //p')"
          test -n "$TRIPLE" || { echo "cannot determine host triple"; exit 1; }
          OUT="heterion-router-gateway-${TRIPLE}.tar.gz"
          tar -czf "$OUT" -C target/release heterion-router-gateway
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "$OUT" > "${OUT}.sha256"
          else
            # macOS runners ship shasum, not sha256sum.
            shasum -a 256 "$OUT" > "${OUT}.sha256"
          fi
          ls -la "$OUT" "${OUT}.sha256"
          if [ "$EVENT_NAME" = "push" ]; then
            TAG="${GITHUB_REF_NAME}"
          elif [ -n "${TAG_IN:-}" ]; then
            TAG="$TAG_IN"
          else
            TAG="gateway-$(date +%Y%m%d)-$(git rev-parse --short HEAD)"
          fi
          if gh release view "$TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" "$OUT" "${OUT}.sha256" -R "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$TAG" "$OUT" "${OUT}.sha256" -R "$GITHUB_REPOSITORY" \
              --title "Gateway ${TAG}" \
              --notes "heterion-router-gateway binary (${TRIPLE}). Built from ${{ github.event_name == 'push' && github.ref_name || inputs.ref }}."
          fi

  app-macos:
    name: Heterion Router.app (macos-15, arm64)
    needs: gateway
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'push' && github.ref_name || inputs.ref }}
      - uses: dtolnay/rust-toolchain@1.99.1
      - uses: Swatinem/rust-cache@v2
      - name: Build .app bundle
        run: |
          set -eu
          bash desktop/scripts/build-app.sh
      - name: Assert the bundle is arm64
        run: |
          set -eu
          BIN="desktop/gpui/dist/Heterion Router.app/Contents/MacOS/heterion-router-desktop"
          file "$BIN" | grep -q 'arm64' || {
            echo "the bundle is not an arm64 build:" >&2; file "$BIN" >&2; exit 1; }
      - name: Package and publish app to release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_IN: ${{ inputs.tag }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -eu
          APP_DIR="desktop/gpui/dist/Heterion Router.app"
          test -d "$APP_DIR" || { echo "missing $APP_DIR"; exit 1; }
          if [ "$EVENT_NAME" = "push" ]; then
            TAG="${GITHUB_REF_NAME}"
          elif [ -n "${TAG_IN:-}" ]; then
            TAG="$TAG_IN"
          else
            TAG="gateway-$(date +%Y%m%d)-$(git rev-parse --short HEAD)"
          fi
          ZIP="Heterion-Router-macos-arm64.app.zip"
          # ditto preserves bundle structure and code signature.
          ditto -c -k --sequesterRsrc --keepParent "$APP_DIR" "$ZIP"
          if command -v shasum >/dev/null 2>&1; then
            shasum -a 256 "$ZIP" > "${ZIP}.sha256"
          else
            sha256sum "$ZIP" > "${ZIP}.sha256"
          fi
          ls -la "$ZIP" "${ZIP}.sha256"
          if gh release view "$TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" "$ZIP" "${ZIP}.sha256" -R "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$TAG" "$ZIP" "${ZIP}.sha256" -R "$GITHUB_REPOSITORY" \
              --title "Gateway ${TAG}" \
              --notes "Heterion Router macOS app and binaries. Built from ${{ github.event_name == 'push' && github.ref_name || inputs.ref }}."
          fi
