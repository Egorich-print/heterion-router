# On-demand release: gateway binaries as release assets.
# Manual only (`workflow_dispatch`); the Tauri desktop bundle stays a local
# build (`cargo tauri build` needs macOS for real .app/.dmg artifacts).
name: release

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref to build"
        default: main
      tag:
        description: "Release tag (empty = gateway-YYYYMMDD-<sha>)"
        default: ""

permissions:
  contents: write

jobs:
  gateway:
    name: gateway binary (${{ matrix.os }})
    strategy:
      matrix:
        os: [ubuntu-latest, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - uses: dtolnay/rust-toolchain@1.99.0
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --release -p heterion-router-gateway
      - name: Package + publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_IN: ${{ inputs.tag }}
        run: |
          set -eu
          TRIPLE="$(rustc -vV | sed -n 's/^host: //p')"
          test -n "$TRIPLE" || { echo "cannot determine host triple"; exit 1; }
          OUT="heterion-router-gateway-${TRIPLE}.tar.gz"
          tar -czf "$OUT" -C target/release heterion-router-gateway
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "$OUT" > "${OUT}.sha256"
          else
            # macOS runners ship shasum, not sha256sum.
            shasum -a 256 "$OUT" > "${OUT}.sha256"
          fi
          ls -la "$OUT" "${OUT}.sha256"
          if [ -z "$TAG_IN" ]; then
            TAG="gateway-$(date +%Y%m%d)-$(git rev-parse --short HEAD)"
          else
            TAG="$TAG_IN"
          fi
          if gh release view "$TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" "$OUT" "${OUT}.sha256" -R "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$TAG" "$OUT" "${OUT}.sha256" -R "$GITHUB_REPOSITORY" \
              --title "Gateway ${TAG}" \
              --notes "heterion-router-gateway binary (${TRIPLE}). Built from ${{ inputs.ref }}."
          fi
