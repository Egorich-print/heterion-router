[package]
name = "heterion-router-desktop"
version = "0.1.0"
description = "Heterion Router desktop shell (Tauri v2)"
authors = ["Heterion Router Contributors"]
license = "MIT"
repository = "https://github.com/Egorich-print/heterion-router"
edition = "2024"
rust-version = "1.98"

[lib]
name = "heterion_router_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.3", features = [] }
tauri-plugin-log = "2"
tauri-plugin-shell = "2"
tauri-plugin-single-instance = "2"
