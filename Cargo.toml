# Heterion Router workspace (axum + Tauri v2 + Svelte).
#
# Successor of the OmniRoute-Rust port: an OpenAI-compatible LLM gateway
# with combo routing, a built-in dashboard and a Tauri desktop shell.
# Sibling of Heterion (which it can target as a keyless local provider);
# the frozen OmniRoute JS app remains the reference implementation.
[workspace]
resolver = "3"
members = [
    "crates/heterion-router-config",
    "crates/heterion-router-core",
    "crates/heterion-router-crypto",
    "crates/heterion-router-db",
    "crates/heterion-router-gateway",
    "crates/heterion-router-http",
    "crates/heterion-router-providers",
    "crates/heterion-router-routing",
    "crates/heterion-router-translate",
    "crates/heterion-router-usage",
]
# The Tauri desktop app is a heavy, standalone binary app: keep it out of the
# fast gateway workspace/CI loop. Build it with `cargo tauri` in desktop/.
exclude = ["desktop/src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
license = "MIT"
authors = ["Heterion Router Contributors"]

[workspace.dependencies]
heterion-router-config = { path = "crates/heterion-router-config" }
heterion-router-core = { path = "crates/heterion-router-core" }
heterion-router-crypto = { path = "crates/heterion-router-crypto" }
heterion-router-db = { path = "crates/heterion-router-db" }
heterion-router-http = { path = "crates/heterion-router-http" }
heterion-router-providers = { path = "crates/heterion-router-providers" }
heterion-router-routing = { path = "crates/heterion-router-routing" }
heterion-router-translate = { path = "crates/heterion-router-translate" }
heterion-router-usage = { path = "crates/heterion-router-usage" }

axum = "0.8"
tokio = { version = "1", features = ["full"] }
tokio-stream = { version = "0.1", features = ["sync"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.40", features = ["bundled"] }
thiserror = "2"
tempfile = "2"
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
async-trait = "0.1"
futures = "0.3"
aes-gcm = "0.11"
scrypt = "0.12"
sha2 = "0.11"
hex = "0.4"
getrandom = "0.4"
insta = "1"
wiremock = "0.6"
reqwest = { version = "0.12", default-features = false, features = [
    "json",
    "rustls-tls",
    "stream",
] }

[profile.release]
lto = "thin"
codegen-units = 1
